<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sudlo2026 — Minimal</title>
  <style>
    :root{--bg:#fff;--fg:#0b1220;--muted:#4b5563;--accent:#0ea5e9}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;line-height:1.5;color:var(--fg);background:var(--bg);margin:0;padding:24px}
    header{max-width:900px;margin:0 auto 24px}
    h1{font-size:1.6rem;margin:0 0 8px}
    p{margin:0 0 16px;color:var(--muted)}
    .search{max-width:900px;margin:0 auto 16px}
    input[type="search"]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e6eef3}
    .grid{max-width:900px;margin:16px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .card{padding:12px;border-radius:8px;border:1px solid #eef4f8;background:#f8fbfd}
    .card h3{margin:0 0 6px;font-size:1rem}
    .card p{margin:0;color:var(--muted);font-size:0. nine rem}
    footer{max-width:900px;margin:40px auto;color:var(--muted);font-size:0. nine rem}
  </style>
</head>
<body>
  <header>
    <h1>Sudlo2026 — Minimal</h1>
    <p>Accessible, single-file knowledge base — compact demo. Use the search box to filter items.</p>
  </header>

  <div class="search">
    <label for="q" style="display:none">Search</label>
    <input id="q" type="search" placeholder="Search topics..." aria-label="Search topics">
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>
    <p>Created for preview. For the full site and other variants see the repository.</p>
  </footer>

  <script>
    const data = [
      {id:'aws', title:'AWS', subtitle:'Cloud provider', overview:'Compute, storage, database, and more.'},
      {id:'k8s', title:'Kubernetes', subtitle:'Orchestration', overview:'Manage containerized workloads at scale.'},
      {id:'terraform', title:'Terraform', subtitle:'Infrastructure as Code', overview:'Define infrastructure declaratively.'},
      {id:'redis', title:'Redis', subtitle:'In-memory store', overview:'Fast cache and message broker.'}
    ];

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');

    function render(list){
      grid.innerHTML = '';
      if(list.length===0){ grid.innerHTML = '<div style="grid-column:1/-1;color:#6b7280">No results</div>'; return }
      list.forEach(item=>{
        const d = document.createElement('article'); d.className='card'; d.tabIndex=0;
        d.innerHTML = `<h3>${item.title}</h3><p>${item.subtitle}</p><p style="margin-top:8px;color:#374151">${item.overview}</p>`;
        grid.appendChild(d);
      });
    }

    q.addEventListener('input', ()=>{
      const v = q.value.trim().toLowerCase();
      if(!v) return render(data);
      render(data.filter(it => it.title.toLowerCase().includes(v) || (it.subtitle||'').toLowerCase().includes(v) || (it.overview||'').toLowerCase().includes(v)));
    });

    render(data);
  </script>
</body>
</html>
