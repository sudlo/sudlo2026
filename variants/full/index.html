<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sudlo2026 — Full Knowledge Base (variant)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-overlay"></div>
  <div class="container" id="app">
    <div class="header">
      <h1>Sudlo2026 — Full (variant)</h1>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search topics..." aria-label="Search">
      <button id="goforitBtn" class="goforit">goforit</button>
    </div>
    <main class="grid" id="grid" aria-live="polite"></main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <button id="closeModal" class="close">Close</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
