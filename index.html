<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudlo2026 | The Matrix Cloud & DevOps Core</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #030a03;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            font-size: 14px;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.15; pointer-events: none;
        }

        a { text-decoration: none; color: inherit; transition: color 0.2s; }

        .container {
            max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 0; border-bottom: 1px solid #003311;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; text-shadow: 0 0 8px rgba(0,255,102,0.6); }
        .logo-icon { color: #00ff66; font-size: 18px; }
        .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .logo-subtitle { font-size: 10px; color: #008833; text-transform: uppercase; letter-spacing: 1px; }

        .nav-links { display: flex; gap: 30px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #00aa44; align-items: center; }
        .nav-links a:hover { color: #00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.8); }

        .backend-indicator {
            display: flex; align-items: center; gap: 6px; font-size: 10px; cursor: pointer; border: 1px solid #003311; padding: 4px 10px; border-radius: 3px;
        }
        .backend-indicator:hover { border-color: #00ff66; }
        .backend-dot { height: 7px; width: 7px; border-radius: 50%; background-color: #444; box-shadow: none; transition: all 0.3s; }
        .backend-dot.live { background-color: #00ff66; box-shadow: 0 0 6px #00ff66; }
        .backend-dot.offline { background-color: #ff3333; box-shadow: 0 0 6px #ff3333; }
        .backend-dot.checking { background-color: #ffcc00; box-shadow: 0 0 6px #ffcc00; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .hero { padding: 60px 0 30px 0; }
        .hero-status { display: flex; align-items: center; gap: 10px; color: #00ff66; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;}
        .status-dot { height: 8px; width: 8px; background-color: #00ff66; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff66; }

        .hero-title {
            font-size: 44px; font-weight: 700; line-height: 1.1; margin-bottom: 20px; max-width: 800px; text-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        .title-highlight { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.8); }

        .hero-description { font-size: 15px; color: #00aa44; max-width: 700px; margin-bottom: 30px; }

        /* Search Console */
        .search-console {
            background-color: rgba(0, 15, 5, 0.9); border: 1px solid #005522; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,255,102,0.1);
        }
        .search-input-wrapper {
            display: flex; align-items: center; background-color: #010802; border: 1px solid #007733; border-radius: 6px; padding: 10px 18px; gap: 12px;
        }
        .search-input-wrapper:focus-within { border-color: #00ff66; box-shadow: 0 0 12px rgba(0,255,102,0.3); }
        .ai-prompt-symbol { color: #00ff66; font-weight: bold; font-size: 16px; text-shadow: 0 0 6px #00ff66; }
        .search-box {
            background: transparent; border: none; color: #00ff66; font-family: 'JetBrains Mono', monospace; font-size: 15px; width: 100%; outline: none;
        }
        .search-btn {
            background-color: #003311; border: 1px solid #00ff66; color: #00ff66; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-weight: bold; white-space: nowrap;
        }
        .search-btn:hover:not(:disabled) { background-color: #00ff66; color: #030a03; text-shadow: none; box-shadow: 0 0 10px #00ff66; }
        .search-btn:disabled { opacity: 0.5; cursor: wait; }

        .search-hints { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
        .hint-pill {
            background-color: #021a08; border: 1px solid #004416; color: #00cc52; font-size: 11px; padding: 5px 12px; border-radius: 4px; cursor: pointer;
        }
        .hint-pill:hover { border-color: #00ff66; color: #fff; background-color: #003311; }
        .search-mode-note { font-size: 10px; color: #005522; margin-top: 10px; }

        /* AI Results Panel */
        #ai-search-results {
            display: none; background-color: rgba(2, 18, 6, 0.95); border: 1px solid #00ff66; padding: 24px; border-radius: 8px; margin-bottom: 40px; box-shadow: 0 0 25px rgba(0,255,102,0.2);
        }
        .ai-results-header { color: #00ff66; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; text-shadow: 0 0 6px #00ff66; }
        .ai-results-content { color: #b3ffcc; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
        .ai-results-content ol { margin-left: 20px; margin-top: 10px; }
        .ai-results-content li { margin-bottom: 6px; }
        .ai-results-content code { background: #00220a; color: #00ff66; padding: 2px 6px; border-radius: 3px; font-size: 12px; border: 1px solid #005522; }

        /* Grid Layout */
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; color: #008833; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background-color: #003311; border: 1px solid #003311; margin-bottom: 60px; }
        .card { background-color: #030d05; padding: 30px; position: relative; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .card:hover { background-color: #061a0b; border-left: 3px solid #00ff66; }
        .card.ai-highlighted { border-left: 3px solid #00ff66; background-color: #061f0c; box-shadow: inset 0 0 20px rgba(0,255,102,0.15); }
        .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; }
        
        .external-link { 
            background: #00220a; border: 1px solid #005522; color: #00ff66; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: inline-block; z-index: 10;
        }
        .external-link:hover { background: #00ff66; color: #030a03; border-color: #00ff66; box-shadow: 0 0 8px #00ff66; }

        .card-meta { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #008833; margin-bottom: 8px; }
        .card-title { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
        .card-description { font-size: 13px; color: #00aa44; }
        .tutorial-badge { font-size: 10px; background: #00220a; color: #00ff66; border: 1px solid #005522; padding: 2px 8px; border-radius: 3px; margin-top: 15px; display: inline-block; }

        /* Modals */
        #tutorialModal, #settingsModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 5, 2, 0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #020d04; border: 1px solid #00ff66; max-width: 700px; width: 100%; border-radius: 8px; padding: 30px; box-shadow: 0 0 35px rgba(0, 255, 102, 0.3); max-height: 85vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #004416; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-title { color: #00ff66; font-size: 20px; font-weight: bold; }
        .close-btn { background: none; border: none; color: #008833; font-size: 18px; cursor: pointer; font-family: monospace; }
        .close-btn:hover { color: #00ff66; }
        .tutorial-steps ol { margin-left: 20px; color: #b3ffcc; }
        .tutorial-steps li { margin-bottom: 12px; font-size: 13px; }
        .tutorial-steps code { background: #00220a; color: #00ff66; padding: 2px 6px; border-radius: 3px; font-size: 12px; }

        .settings-row { margin-bottom: 16px; }
        .settings-row label { display: block; font-size: 11px; color: #008833; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

            width: 100%; background: #010802; border: 1px solid #00
